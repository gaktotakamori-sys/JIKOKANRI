    const calculateDiffDays = (pastDateStr) => {
      if (!pastDateStr) return 999;
      const past = new Date(pastDateStr);
      const now = new Date();
      const diffTime = Math.abs(now.getTime() - past.getTime());
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    };

    const getRemainingDays = (task) => {
      if (task.type === 'single' && task.completed) return 99999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (task.type === 'single') {
        if (!task.dueDate) return 9990;
        const due = new Date(task.dueDate);
        due.setHours(0, 0, 0, 0);
        return Math.round((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'cycle') {
        if (!task.lastDoneDate) return -task.cycleDays;
        const last = new Date(task.lastDoneDate);
        last.setHours(0, 0, 0, 0);
        const dueTime = last.getTime() + task.cycleDays * 86400000;
        return Math.round((dueTime - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'monthly') {
        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth();
        const currentDay = today.getDate();
        const fixedDay = Math.min(31, Math.max(1, task.fixedDay || 1));

        let targetDate = new Date(currentYear, currentMonth, fixedDay);
        targetDate.setHours(0, 0, 0, 0);

        if (currentDay > fixedDay) {
          if (task.lastDoneDate) {
            const last = new Date(task.lastDoneDate);
            if (last.getFullYear() === currentYear && last.getMonth() === currentMonth) {
              targetDate = new Date(currentYear, currentMonth + 1, fixedDay);
            }
          }
        } else if (task.lastDoneDate) {
          const last = new Date(task.lastDoneDate);
          if (last.getFullYear() === currentYear && last.getMonth() === currentMonth) {
            targetDate = new Date(currentYear, currentMonth + 1, fixedDay);
          }
        }
        return Math.round((targetDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }
      return 9990;
    };

      // 画面復帰時・定期チェック（スリープから復帰したり24時を跨いだ瞬間に自動リセット）

        const mergedList = [
          { date: today, expGained: todayExpGained },
          ...pastRecords
        ].sort((a, b) => b.expGained - a.expGained);

        const todayRank = mergedList.findIndex(item => item.date === today) + 1;
        const totalDaysRecorded = mergedList.length;

        let nextRankExpNeeded = 0;
        let nextTargetRank = todayRank - 1;
        if (todayRank > 1) {
          const targetRecord = mergedList[todayRank - 2];
          nextRankExpNeeded = Math.max(1, (targetRecord.expGained - todayExpGained) + 1);
        }

        let leadExp = 0;
        if (todayRank === 1 && pastRecords.length > 0) {
          leadExp = todayExpGained - pastRecords[0].expGained;
        }

        const pastAverage = pastRecords.length > 0
          ? Math.round(pastRecords.reduce((acc, cur) => acc + cur.expGained, 0) / pastRecords.length)
          : 30;

        const growthRate = pastAverage > 0
          ? Math.round(((todayExpGained - pastAverage) / pastAverage) * 100)
          : 0;

        return {
          sorted: mergedList,
          todayRank: todayRank > 0 ? todayRank : 1,
          totalDaysRecorded,
          nextRankExpNeeded,
          nextTargetRank,
          leadExp,
          pastAverage,
          growthRate

        const currentBase = current.minExp;
        const nextBase = next ? next.minExp : current.minExp + 1000;

          ? Math.min(100, Math.max(0, ((totalExp - currentBase) / (nextBase - currentBase)) * 100))

        return {

            const quest = DAILY_QUEST_POOL[i];

          )}

          {/* 突発ログ削除モーダル */}
          {deletingAdhocLog && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500/40 w-full max-w-sm rounded-3xl p-5 shadow-2xl text-center">
                <div className="inline-flex p-3 bg-rose-500/20 text-rose-400 rounded-2xl mb-2">
                  <Trash2 className="w-6 h-6" />
                </div>
                <h3 className="text-sm font-bold text-white mb-1">突発ログの削除</h3>
                <p className="text-xs text-slate-300 leading-relaxed px-2">
                  「{deletingAdhocLog.emoji} {deletingAdhocLog.name}」を削除しますか？<br />
                  <span className="text-amber-400 font-bold">獲得した {deletingAdhocLog.exp} EXP も取り消されます。</span>
                </p>
                <div className="mt-4 grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setDeletingAdhocLog(null)}
                    className="py-2.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleConfirmDeleteAdhoc}
                    className="py-2.5 bg-rose-600 text-white font-bold text-xs rounded-xl active:scale-95 transition-all"
                  >
                    削除する
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* テンプレ編集モーダル */}
          {editingTemplateItem && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 w-full max-w-md rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-slate-100 flex items-center gap-1.5">
                    <Edit3 className="w-4 h-4 text-amber-400" />
                    <span>{editingTemplateItem.isNew ? '新しいテンプレートの作成' : 'テンプレートの編集'}</span>
                  </h3>
                  <button onClick={() => setEditingTemplateItem(null)} className="p-1 rounded-xl bg-slate-800 text-slate-400">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTemplateItem} className="space-y-3 mt-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">所属カテゴリ名</label>
                    <input
                      type="text"
                      required
                      value={editingTemplateItem.category}
                      onChange={(e) => setEditingTemplateItem({ ...editingTemplateItem, category: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">絵文字</label>
                    <input
                      type="text"
                      value={editingTemplateItem.emoji}
                      onChange={(e) => setEditingTemplateItem({ ...editingTemplateItem, emoji: e.target.value })}
                      className="w-14 text-center text-xl bg-slate-800 border border-slate-700 rounded-xl p-2 text-slate-100"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">テンプレート名</label>
                    <input
                      type="text"
                      required
                      value={editingTemplateItem.name}
                      onChange={(e) => setEditingTemplateItem({ ...editingTemplateItem, name: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">獲得EXP</label>
                    <input
                      type="number"
                      min={1}
                      value={editingTemplateItem.exp}
                      onChange={(e) => setEditingTemplateItem({ ...editingTemplateItem, exp: Number(e.target.value) })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                    />
                  </div>
                  <div className="pt-3 border-t border-slate-800 flex items-center justify-between">
                    {!editingTemplateItem.isNew ? (
                      <button
                        type="button"
                        onClick={() => handleDeleteTemplateItem(editingTemplateItem.id)}
                        className="px-3 py-2 bg-rose-500/20 text-rose-300 rounded-xl text-xs font-bold"
                      >
                        削除
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={() => setEditingTemplateItem(null)}
                        className="px-4 py-2 bg-slate-800 text-slate-400 rounded-xl"
                      >
                        キャンセル
                      </button>
                    )}
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold rounded-xl text-xs"
                    >
                      {editingTemplateItem.isNew ? '登録' : '保存'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 確定報告書を開く固定フッターボタン */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 pb-[calc(env(safe-area-inset-bottom)+12px)]">
            <div className="max-w-xl mx-auto flex items-center gap-2">
              <button
                onClick={() => setShowReportModal(true)}
                className="w-full py-3 px-4 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-sm rounded-2xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]"
              >
                <Sparkles className="w-5 h-5 fill-slate-950 text-slate-950" />
                <span>今日を完了して報告文を作る (自己肯定感＆実生活配当)</span>
              </button>
            </div>
          </div>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
