    const getTodayString = () => new Date().toISOString().split('T')[0];

    const getRemainingDays = (task) => {
      if (task.type === 'single' && task.completed) return 99999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (task.type === 'single') {
        if (!task.dueDate) return 9990;
        const due = new Date(task.dueDate);
        due.setHours(0, 0, 0, 0);
        return Math.round((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'cycle') {
        if (!task.lastDoneDate) return -task.cycleDays;
        const last = new Date(task.lastDoneDate);
        last.setHours(0, 0, 0, 0);
        const dueTime = last.getTime() + task.cycleDays * 86400000;
        return Math.round((dueTime - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'monthly') {
        const cYear = today.getFullYear();
        const cMonth = today.getMonth();
        const cDay = today.getDate();
        const fDay = Math.min(31, Math.max(1, task.fixedDay || 1));
        let target = new Date(cYear, cMonth, fDay);
        target.setHours(0, 0, 0, 0);

        if (cDay > fDay) {
          if (task.lastDoneDate) {
            const last = new Date(task.lastDoneDate);
            if (last.getFullYear() === cYear && last.getMonth() === cMonth) {
              target = new Date(cYear, cMonth + 1, fDay);
            }
          }
        } else if (task.lastDoneDate) {
          const last = new Date(task.lastDoneDate);
          if (last.getFullYear() === cYear && last.getMonth() === cMonth) {
            target = new Date(cYear, cMonth + 1, fDay);
          }
        }
        return Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }
      return 9990;
    };

        setHabits(prev =>
          prev.map(item => {
            if (item.id === id) {
              const expGain = isBonus ? item.exp + item.bonusExp : item.exp;
              triggerExpGain(expGain, isBonus ? `⚡ボーナス +${expGain}` : `+${expGain}`);

              const newTotal = item.totalCount + 1;
              const knowledge = getHabitDividend(item.name);

              // 累計10, 20, 30, 50, 100回突破で特化金字塔モーダルを発動
              if ([10, 20, 30, 50, 100].includes(newTotal)) {
                setTimeout(() => {
                  setMilestoneModalData({
                    taskName: item.name,
                    emoji: item.emoji,
                    totalCount: newTotal,
                    dividendTitle: knowledge.dividendTitle,
                    dividendDesc: knowledge.dividendDesc,
                    trivia: knowledge.trivia
                  });
                }, 400);
              }

              return {
                ...item,
                countToday: item.countToday + 1,
                bonusToday: isBonus ? item.bonusToday + 1 : item.bonusToday,
                totalCount: newTotal,
                lastUpdated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              };
            }
            return item;
          })
        );
      };

      const moveHabit = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= habits.length) return;
        const copy = [...habits];
        const temp = copy[index];
        copy[index] = copy[targetIndex];
        copy[targetIndex] = temp;
        setHabits(copy);
      };

      const completeMaintenanceTask = (id) => {
        setMaintenance(prev =>
          prev.map(task => {
            if (task.id === id) {
              triggerExpGain(task.exp, `✨メンテ完了 +${task.exp}`);
              if (task.type === 'single') {
                return { ...task, completed: true, totalCount: (task.totalCount || 0) + 1 };
              }
              return {
                ...task,
                lastDoneDate: getTodayString(),
                totalCount: (task.totalCount || 0) + 1
              };
            }
            return task;
          })
        );
      };

      const handleSaveMaintenance = (savedTask) => {
        if (!savedTask.id) {
          const newTask = {
            ...savedTask,
            id: 'm-' + Date.now(),
            lastDoneDate: savedTask.lastDoneDate || getTodayString(),
            totalCount: savedTask.totalCount || 0,
            completed: savedTask.type === 'single' ? false : undefined
          };
          setMaintenance(prev => [newTask, ...prev]);
        } else {
          setMaintenance(prev =>
            prev.map(t => (t.id === savedTask.id ? { ...t, ...savedTask } : t))
          );
        }
        setEditingMaintenance(null);
      };

      const addAdhocLog = (name, emoji, exp) => {
        const newLog = {
          id: 'adhoc-' + Date.now(),
          name,
          emoji: emoji || '🌟',
          exp,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setAdhocLogs(prev => [newLog, ...prev]);
        triggerExpGain(exp, `突発ログ +${exp}`);
      };

      const sortedHabits = useMemo(() => {
        if (!filterUncompleted) return habits;
        return [...habits].sort((a, b) => {
          const aDone = a.countToday > 0 ? 1 : 0;
          const bDone = b.countToday > 0 ? 1 : 0;
          return aDone - bDone;
        });
      }, [habits, filterUncompleted]);

      const sortedMaintenance = useMemo(() => {
        const list = maintenance.map(task => ({
          ...task,
          _remainingDays: getRemainingDays(task)
        }));
        return list.sort((a, b) => {
          const aComp = a.type === 'single' && a.completed;
          const bComp = b.type === 'single' && b.completed;
          if (aComp && !bComp) return 1;
          if (!aComp && bComp) return -1;
          return a._remainingDays - b._remainingDays;
        });
      }, [maintenance]);

      const generateReportForDate = (targetDateStr) => {
        const completedList = habits.filter(h => h.countToday > 0);
        const totalTodayCounts = habits.reduce((acc, cur) => acc + cur.countToday, 0);

        let report = `🌟 【自己肯定感＆実生活配当 確定報告書】 🌟\n`;
        report += `📅 日付: ${targetDateStr || getTodayString()}\n`;
        report += `👑 現在の称号: Lv.${currentLevelInfo.level}「${currentLevelInfo.title}」 (累計 ${totalExp} EXP)\n`;
        report += `🌙 24:00自動確定システム記録済\n`;
        report += `────────────────────────────\n\n`;

        report += `🔥 【本日積み上げた偉業（計 ${totalTodayCounts} 回）】\n`;
        if (completedList.length === 0) {
          report += `・まずは息をして今日を生き抜いたこと自体が100点満点の大勝利！\n`;
        } else {
          completedList.forEach(h => {
            report += `・${h.emoji} ${h.name} × ${h.countToday}回（通算: ${h.totalCount}回）\n`;
            if (h.bonusToday > 0) {
              report += `  └ ⚡ 条件ボーナス達成: 「${h.bonusText}」 × ${h.bonusToday}回！\n`;
            }
          });
        }

        if (adhocLogs.length > 0) {
          report += `\n⚡ 【突発的な機転と頑張りのログ】\n`;
          adhocLogs.forEach(l => {
            report += `・${l.emoji} ${l.name} (${l.timestamp}) [+${l.exp} EXP]\n`;
          });
        }

        report += `\n🧬 【本日確定した具体的な実生活・身体配当】\n`;
        if (completedList.length > 0) {
          const uniqueTitled = new Set();
          completedList.forEach(h => {
            const k = getHabitDividend(h.name);
            if (!uniqueTitled.has(k.dividendTitle)) {
              uniqueTitled.add(k.dividendTitle);
              report += `◆ ${h.emoji} ${h.name}：${k.dividendTitle}\n`;
              report += `  ${k.dividendDesc}\n`;
              report += `  💡 科学うんちく: ${k.trivia}\n\n`;
            }
          });
        } else {
          report += `・心身の休息配当：無理をせず余力を温存し、エネルギーを充填しました。\n`;
        }

        report += `────────────────────────────\n`;
        report += `【全肯定メッセージ】\n世界は目立つ成果を求めがちですが、本当に生活を支え、未来の健康と時間を守っているのは、今日あなたがこなした地道な1回1回です。誰が見ていなくても、このアプリとあなたの身体はすべて記憶しています。今夜は胸を張ってゆっくり休んでください✨`;

        return report;
      };

      const copyToClipboard = (text) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        setCopyFeedback(true);
        setTimeout(() => setCopyFeedback(false), 2000);
      };

      return (
        <div className="flex flex-col min-h-[100dvh] bg-slate-900 text-slate-100 font-sans antialiased pb-[calc(env(safe-area-inset-bottom)+84px)]">
          
          {/* Floating EXP gain notification */}
          {floatingExp && (
            <div key={floatingExp.key} className="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none animate-bounce">
              <div className="bg-amber-400 text-slate-950 font-black text-xs px-3.5 py-1.5 rounded-full shadow-lg shadow-amber-400/40 flex items-center gap-1 border-2 border-white">
                <Icon name="zap" className="w-3.5 h-3.5 text-slate-950" fill="currentColor" />
                <span>{floatingExp.label}</span>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 pt-[env(safe-area-inset-top)] px-4 pb-2.5">
            <div className="max-w-xl mx-auto flex items-center justify-between gap-2 pt-2">
              <div className="flex items-center gap-2 min-w-0">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center font-black text-slate-950 text-sm shadow-md shrink-0">
                  Lv.{currentLevelInfo.level}
                </div>
                <div className="min-w-0">
                  <div className="text-xs font-bold text-amber-300 truncate flex items-center gap-1">
                    <Icon name="trophy" className="w-3 h-3 shrink-0" />
                    <span className="truncate">{currentLevelInfo.title}</span>
                  </div>
                  <div className="text-[10px] text-slate-400">
                    累計 <strong className="text-slate-100 font-bold">{totalExp}</strong> EXP
                  </div>
                </div>
              </div>

              {/* Header Right Actions */}
              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={() => setShowHistoryModal(true)}
                  className="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-bold text-xs flex items-center gap-1 transition-all active:scale-95"
                  title="過去のTOP3＆直近1週間の報告文アーカイブ"
                >
                  <Icon name="book-open" className="w-3.5 h-3.5 text-amber-400" />
                  <span>📜 過去実績</span>
                </button>
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors"
                  title="設定・バックアップ"
                >
                  <Icon name="settings" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* EXP Gauge */}
            <div className="max-w-xl mx-auto mt-2">
              <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden border border-slate-700/50">
                <div
                  className="bg-gradient-to-r from-amber-400 to-orange-500 h-full rounded-full transition-all duration-300"
                  style={{ width: `${currentLevelInfo.progressPercent}%` }}
                />
              </div>
            </div>

            {/* リアルタイム歴代ランキング連動インジケーター（あと〇〇EXPで〇位！） */}
            <div
              onClick={() => setShowHistoryModal(true)}
              className="max-w-xl mx-auto mt-2 bg-gradient-to-r from-amber-500/15 via-orange-500/15 to-amber-500/10 hover:from-amber-500/25 hover:to-orange-500/20 border border-amber-500/40 rounded-xl px-3 py-1.5 flex items-center justify-between cursor-pointer transition-all active:scale-[0.99] shadow-sm"
              title="タップで歴代TOP3と過去1週間の報告文を開く"
            >
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-sm shrink-0">
                  {rankingTargetInfo.targetRank === 1 ? '👑' : rankingTargetInfo.targetRank === 2 ? '🥈' : '🥉'}
                </span>
                <div className="flex items-center gap-1.5 flex-wrap min-w-0">
                  <span className="text-[11px] text-slate-300 font-medium">
                    本日: <strong className="text-amber-300 font-mono font-bold">+{todayEarnedExp}</strong> EXP
                  </span>
                  <span className="text-slate-600 text-[10px]">|</span>
                  <span className="text-xs font-black text-amber-200 tracking-tight whitespace-normal break-words">
                    {rankingTargetInfo.text}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1 text-[10px] text-amber-400 font-bold shrink-0 pl-1">
                <span>歴代TOP3</span>
                <Icon name="book-open" className="w-3 h-3 text-amber-400" />
              </div>
            </div>
          </header>

          {/* Navigation and Uncompleted Toggle */}
          <div className="max-w-xl mx-auto w-full px-4 pt-2.5">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5 bg-slate-800/80 px-2.5 py-1 rounded-xl border border-slate-700/60 text-xs">
                <Icon name="filter" className="w-3 h-3 text-slate-400" />
                <span className="text-slate-300 text-[11px] font-medium">未完了を優先</span>
                <button
                  type="button"
                  onClick={() => setFilterUncompleted(!filterUncompleted)}
                  className={`w-7 h-4 flex items-center rounded-full p-0.5 transition-colors ${
                    filterUncompleted ? 'bg-amber-500 justify-end' : 'bg-slate-700 justify-start'
                  }`}
                >
                  <div className="bg-white w-3 h-3 rounded-full shadow-sm" />
                </button>
              </div>

              <div className="text-[11px] text-slate-400 font-mono">
                {activeTab === 'habits' && `${habits.length} 個の習慣`}
                {activeTab === 'maintenance' && `${maintenance.length} 件のメンテ`}
                {activeTab === 'adhoc' && `${adhocLogs.length} 件の突発ログ`}
              </div>
            </div>

            {/* Tab selection */}
            <div className="grid grid-cols-3 gap-1 bg-slate-800/90 p-1 rounded-2xl border border-slate-700/80">
              <button
                onClick={() => setActiveTab('habits')}
                className={`py-1.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1 ${
                  activeTab === 'habits'
                    ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon name="refresh" className="w-3.5 h-3.5" />
                <span>日々の習慣</span>
              </button>
              <button
                onClick={() => setActiveTab('maintenance')}
                className={`py-1.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1 ${
                  activeTab === 'maintenance'
                    ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon name="calendar" className="w-3.5 h-3.5" />
                <span>定期メンテ</span>
              </button>
              <button
                onClick={() => setActiveTab('adhoc')}
                className={`py-1.5 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1 ${
                  activeTab === 'adhoc'
                    ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon name="zap" className="w-3.5 h-3.5" />
                <span>突発ログ</span>
              </button>
            </div>
          </div>

          <main className="max-w-xl mx-auto w-full px-4 pt-2.5 flex-1">
            
            {/* 1. 日々の習慣タブ */}
            {activeTab === 'habits' && (
              <div className="space-y-2.5">
                {sortedHabits.map((habit, index) => {
                  const isCompletedToday = habit.countToday > 0;
                  const knowledge = getHabitDividend(habit.name);

                  return (
                    <div
                      key={habit.id}
                      className={`bg-slate-800/85 border rounded-2xl p-3 transition-all ${
                        isCompletedToday
                          ? 'border-emerald-500/40 bg-slate-800/95'
                          : 'border-slate-700/80 hover:border-slate-600'
                      }`}
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-start gap-2.5 min-w-0">
                          <span className="text-2xl shrink-0 p-1 bg-slate-700/50 rounded-xl">{habit.emoji}</span>
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <h3 className="text-sm font-bold text-slate-100 whitespace-normal break-words">
                                {habit.name}
                              </h3>
                              <span className="text-[10px] font-semibold bg-slate-700/80 text-amber-300 px-1.5 py-0.5 rounded-md border border-slate-600/50">
                                通算 {habit.totalCount} 回
                              </span>
                            </div>

                            {/* Scientific Benefit Tag */}
                            <div className="text-[10px] text-sky-300/90 font-medium mt-0.5">
                              {knowledge.benefitTag}
                            </div>

                            <div className="flex items-center gap-2 mt-1 text-[11px] text-slate-400">
                              <span>本日: <strong className={habit.countToday > 0 ? 'text-emerald-400 font-bold' : 'text-slate-400'}>{habit.countToday}</strong> 回</span>
                              {habit.bonusToday > 0 && (
                                <span className="text-[10px] text-amber-300 bg-amber-950/60 px-1.5 py-0.5 rounded border border-amber-500/30 font-semibold">
                                  ⚡条件 {habit.bonusToday} 回
                                </span>
                              )}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-1.5 shrink-0">
                          {/* One-click link button: Appears automatically when linkUrl is set */}
                          {habit.linkUrl && habit.linkUrl.trim() !== '' && (
                            <a
                              href={/^https?:\/\//i.test(habit.linkUrl.trim()) ? habit.linkUrl.trim() : `https://${habit.linkUrl.trim()}`}
                              target="_blank"
                              rel="noopener noreferrer"
                              onClick={(e) => e.stopPropagation()}
                              className="px-2.5 py-1 bg-sky-950/90 hover:bg-sky-900 border border-sky-400/60 text-sky-300 rounded-xl text-xs font-bold flex items-center gap-1 transition-all active:scale-95 shadow-md shadow-sky-950/50 shrink-0"
                              title={`${habit.name}の参考リンクを開く`}
                            >
                              <Icon name="link" className="w-3.5 h-3.5 text-sky-400" />
                              <span>リンク</span>
                              <Icon name="external-link" className="w-3 h-3 text-sky-400/80" />
                            </a>
                          )}
                          <button
                            onClick={() => setEditingTask(habit)}
                            className="p-1.5 text-slate-400 hover:text-amber-300 rounded-lg bg-slate-700/40"
                            title="編集"
                          >
                            <Icon name="edit" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>

                      {/* Action buttons */}
                      <div className="mt-3 grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/50">
                        <button
                          onClick={() => handleHabitIncrement(habit.id, false)}
                          className="py-2 px-3 bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all rounded-xl text-xs font-bold text-slate-100 flex items-center justify-center gap-1.5 shadow-sm"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5 text-emerald-400" />
                          <span>できた (+{habit.exp})</span>
                        </button>
                        <button
                          onClick={() => handleHabitIncrement(habit.id, true)}
                          className="py-2 px-3 bg-gradient-to-r from-amber-500/20 to-orange-500/20 hover:from-amber-500/30 hover:to-orange-500/30 border border-amber-500/30 active:scale-95 transition-all rounded-xl text-xs font-bold text-amber-300 flex items-center justify-center gap-1.5 shadow-sm"
                        >
                          <Icon name="zap" className="w-3.5 h-3.5 text-amber-400" />
                          <span className="truncate">{habit.bonusText || '条件達成'} (+{habit.exp + habit.bonusExp})</span>
                        </button>
                      </div>
                    </div>
                  );
                })}

                <button
                  onClick={() =>
                    setEditingTask({
                      id: 'h-' + Date.now(),
                      name: '',
                      emoji: '✨',
                      exp: 10,
                      bonusText: '',
                      bonusExp: 5,
                      linkUrl: '',
                      countToday: 0,
                      bonusToday: 0,
                      totalCount: 0,
                      lastUpdated: ''
                    })
                  }
                  className="w-full py-2.5 bg-slate-800/60 hover:bg-slate-800 border border-dashed border-slate-700/80 rounded-2xl text-xs text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5 transition-colors"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>+ 新しい習慣を追加</span>
                </button>
              </div>
            )}

            {/* 2. 定期メンテナンスタブ */}
            {activeTab === 'maintenance' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between bg-slate-800/40 p-2.5 rounded-2xl border border-slate-700/50">
                  <div className="flex items-center gap-1.5 text-xs text-slate-400">
                    <Icon name="clock" className="w-3.5 h-3.5 text-amber-400" />
                    <span>期限・緊急度順に自動ソート中</span>
                  </div>
                  <button
                    onClick={() =>
                      setEditingMaintenance({
                        id: null,
                        name: '',
                        emoji: '🧹',
                        type: 'cycle',
                        cycleDays: 14,
                        fixedDay: 1,
                        dueDate: getTodayString(),
                        lastDoneDate: getTodayString(),
                        exp: 30,
                        totalCount: 0
                      })
                    }
                    className="px-3 py-1 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold text-xs rounded-xl flex items-center gap-1 shadow-sm active:scale-95"
                  >
                    <Icon name="plus" className="w-3.5 h-3.5" />
                    <span>+ 定期タスク登録</span>
                  </button>
                </div>

                {sortedMaintenance.map((task) => {
                  const remaining = task._remainingDays ?? getRemainingDays(task);
                  let statusBadge = null;

                  if (task.type === 'single' && task.completed) {
                    statusBadge = <span className="px-2 py-0.5 text-[10px] font-bold bg-slate-700 text-slate-400 rounded-full">完了済</span>;
                  } else if (remaining < 0) {
                    statusBadge = <span className="px-2 py-0.5 text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded-full animate-pulse">{Math.abs(remaining)}日 超過！</span>;
                  } else if (remaining === 0) {
                    statusBadge = <span className="px-2 py-0.5 text-[10px] font-bold bg-orange-500/20 text-orange-300 border border-orange-500/40 rounded-full animate-pulse">⚡ 本日が期日！</span>;

                  } else {
                    statusBadge = <span className="px-2 py-0.5 text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full">良好 (あと{remaining}日)</span>;

                  return (
                    <div
                      key={task.id}
                      className={`bg-slate-800/80 border rounded-2xl p-3.5 transition-all ${
                        task.completed ? 'opacity-60 border-slate-700/60' : remaining <= 0 ? 'border-rose-500/40 bg-slate-800/95' : 'border-slate-700/80'

                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-start gap-2.5 min-w-0">
                          <span className="text-2xl p-1 bg-slate-700/50 rounded-xl shrink-0">{task.emoji}</span>
                          <div className="min-w-0">
                            <div className="flex items-center gap-2 flex-wrap">

                            </div>
                            <div className="text-xs text-slate-400 mt-1">

                  <div className="text-xs font-bold text-sky-300 mb-1 flex items-center gap-1.5">
                    <span>💡 タスク特化・科学うんちく</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    {milestoneModalData.trivia}
                  </p>
                </div>

                <button
                  onClick={() => setMilestoneModalData(null)}
                  className="mt-4 w-full py-2.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-xs rounded-xl"
                >
                  誇らしく受け取る！
                </button>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-slate-100 flex items-center gap-1.5">
                    <Icon name="settings" className="w-4 h-4 text-amber-400" />
                    <span>データ保護・アプリ設定</span>
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="p-1 rounded-xl bg-slate-800 text-slate-400">
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 mt-4 text-xs">
                  <button
                    onClick={() => setShowInstallGuideModal(true)}
                    className="w-full py-2.5 px-3 bg-gradient-to-r from-amber-500/20 to-indigo-600/30 border border-amber-400/40 rounded-xl text-amber-200 font-bold text-xs"
                  >
                    📱 iPhoneで完全専用アプリ化する手順（1分）
                  </button>

                  <button
                    onClick={() => {
                      const data = {
                        schemaVersion: CURRENT_SCHEMA_VERSION,
                        totalExp,
                        habits,
                        maintenance,
                        adhocLogs,
                        completedQuests,
                        savedReports,
                        lastActiveDate
                      };
                      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `habit-backup-${getTodayString()}.json`;
                      a.click();
                      URL.revokeObjectURL(url);
                    }}
                    className="w-full py-2.5 px-3 bg-slate-800 border border-slate-700 rounded-xl font-bold flex items-center justify-center gap-2"
                  >
                    <Icon name="download" className="w-4 h-4 text-amber-400" />
                    <span>JSONバックアップをダウンロード</span>
                  </button>

                  <label className="w-full py-2.5 px-3 bg-slate-800 border border-slate-700 rounded-xl font-bold flex items-center justify-center gap-2 cursor-pointer">
                    <Icon name="upload" className="w-4 h-4 text-sky-400" />
                    <span>JSONバックアップから復元</span>
                    <input
                      type="file"
                      accept=".json"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const r = new FileReader();
                        r.onload = (evt) => {
                          try {
                            const d = JSON.parse(evt.target.result);
                            if (d.habits) setHabits(d.habits);
                            if (d.totalExp) setTotalExp(d.totalExp);
                            if (d.maintenance) setMaintenance(d.maintenance);
                            if (d.savedReports) setSavedReports(d.savedReports);
                            setShowSettingsModal(false);
                          } catch (err) {
                            console.error(err);
                          }
                        };
                        r.readAsText(file);
                      }}
                      className="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>
          )}

          {/* iPhone App Guide Modal */}
          {showInstallGuideModal && (
            <div className="fixed inset-0 z-[60] bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="text-sm font-bold text-amber-300">iPhone専用アプリ化（約1分）</div>
                  <button onClick={() => setShowInstallGuideModal(false)} className="p-1 rounded-xl bg-slate-800 text-slate-400">
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>
                <div className="mt-3 space-y-2.5 text-xs text-slate-300 leading-relaxed">
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">1. ファイルを保存:</strong><br />
                    画面右上の「…」からダウンロードを押し、この `index.html` を保存します。
                  </div>
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">2. tiiny.host を開く:</strong><br />
                    Safariで無料ホスティング <a href="https://tiiny.host" target="_blank" className="text-amber-400 underline">tiiny.host</a> を開きます。
                  </div>
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">3. アップロード:</strong><br />
                    index.html を選択して Publish を押すと数秒で専用URLが発行されます。
                  </div>
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">4. ホーム画面に追加:</strong><br />
                    Safariの共有ボタン（⎋）から「ホーム画面に追加」を押せば、全画面の専用アプリが完成します。
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
