      return rawMaint.map((m, idx) => {
        if (!m || typeof m !== 'object') return INITIAL_MAINTENANCE[idx % INITIAL_MAINTENANCE.length];
        return {
          id: String(m.id || 'm-' + Date.now() + '-' + idx),
          name: String(m.name || '定期メンテナンス'),
          emoji: String(m.emoji || '🧹'),
          type: (m.type === 'monthly' || m.type === 'single') ? m.type : 'cycle',
          cycleDays: Number(m.cycleDays) || 14,
          fixedDay: Math.min(31, Math.max(1, Number(m.fixedDay) || 1)),
          dueDate: typeof m.dueDate === 'string' ? m.dueDate : getTodayString(),
          lastDoneDate: typeof m.lastDoneDate === 'string' ? m.lastDoneDate : getTodayString(),
          exp: Number(m.exp) || 30,
          totalCount: Math.max(0, Number(m.totalCount) || 0),
          completed: Boolean(m.completed)

    const getRemainingDays = (task) => {
      if (!task || typeof task !== 'object') return 9990;
      if (task.type === 'single' && task.completed) return 99999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (task.type === 'single') {
        if (!task.dueDate) return 9990;
        const due = new Date(task.dueDate);
        due.setHours(0, 0, 0, 0);
        return Math.round((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'cycle') {
        if (!task.lastDoneDate) return -(task.cycleDays || 14);
        const last = new Date(task.lastDoneDate);
        last.setHours(0, 0, 0, 0);
        const cycleDays = Number(task.cycleDays) || 14;
        const dueTime = last.getTime() + cycleDays * 86400000;
        return Math.round((dueTime - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'monthly') {
        const cYear = today.getFullYear();
        const cMonth = today.getMonth();
        const cDay = today.getDate();
        const fDay = Math.min(31, Math.max(1, Number(task.fixedDay) || 1));
        let target = new Date(cYear, cMonth, fDay);
        target.setHours(0, 0, 0, 0);

        if (cDay > fDay) {
          if (task.lastDoneDate) {
            const last = new Date(task.lastDoneDate);
            if (last.getFullYear() === cYear && last.getMonth() === cMonth) {
              target = new Date(cYear, cMonth + 1, fDay);
            }
          }
        } else if (task.lastDoneDate) {
          const last = new Date(task.lastDoneDate);
          if (last.getFullYear() === cYear && last.getMonth() === cMonth) {
            target = new Date(cYear, cMonth + 1, fDay);
          }
        }
        return Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }
      return 9990;
    };

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      handleRepair = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            const sanitized = sanitizeAppState(data);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sanitized));
          }
        } catch (e) {
          localStorage.removeItem(STORAGE_KEY);
        }
        window.location.reload();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-slate-800 border-2 border-amber-400 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                <div className="text-4xl">🛠️</div>
                <h2 className="text-lg font-bold text-amber-300">データ保護・修復モード</h2>
                <p className="text-xs text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-left leading-relaxed">
                  過去のEXPやタスク記録を失うことなく、最新仕様へ自動修復して安全に復帰します。
                </p>
                <button
                  onClick={this.handleRepair}
                  className="w-full py-3 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-xs rounded-xl shadow-lg active:scale-95"
                >
                  安全に自動修復して起動
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

      // 24:00自動確定・カウントダウン
      useEffect(() => {
        const checkMidnight = () => {
          const now = new Date();
          const today = getTodayString();
          const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
          const diffMs = midnight.getTime() - now.getTime();
          const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
          const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          setTimeUntilMidnight(`${diffHrs}時間${diffMins}分`);

          if (lastActiveDate && lastActiveDate !== today) {
            const yesterdayReport = generateReportForDate(lastActiveDate);
            const newArchive = {
              date: lastActiveDate,
              reportText: yesterdayReport,
              totalExpEarned: habits.reduce((acc, h) => acc + ((Number(h.countToday) || 0) * (Number(h.exp) || 0) + (Number(h.bonusToday) || 0) * (Number(h.bonusExp) || 0)), 0),

            setSavedReports(prev => [newArchive, ...prev.filter(r => r.date !== lastActiveDate)]);
            setHabits(prev => prev.map(h => ({ ...h, countToday: 0, bonusToday: 0 })));
            setCompletedQuests([]);
            setAdhocLogs([]);

          return acc + (c * e) + (bc * be);

          };
        } else if (todayEarnedExp > top2) {
          const diff = top1 - todayEarnedExp + 1;
          return {
            text: `🥈 歴代2位圏内！あと ${diff} EXP で歴代1位です！`,
            targetRank: 1,
            diff
          };
        } else if (todayEarnedExp > top3) {
          const diff = top2 - todayEarnedExp + 1;
          return {
            text: `🥉 歴代3位圏内！あと ${diff} EXP で歴代2位です！`,
            targetRank: 2,
            diff
          };
        } else {
          const diff = Math.max(1, top3 - todayEarnedExp + 1);
          return {
            text: `あと ${diff} EXP で歴代3位です！`,
            targetRank: 3,
            diff
          };
        }
      }, [savedReports, todayEarnedExp]);

      // レベル計算
      const currentLevelInfo = useMemo(() => {
        const exp = Number(totalExp) || 0;
        let current = LEVEL_TITLES[0];
        let next = LEVEL_TITLES[1];
        for (let i = 0; i < LEVEL_TITLES.length; i++) {
          if (exp >= LEVEL_TITLES[i].minExp) {
            current = LEVEL_TITLES[i];
            next = LEVEL_TITLES[i + 1] || null;
          } else break;
        }
        const currentBase = current.minExp;
        const nextBase = next ? next.minExp : current.minExp + 1000;
        const progressPercent = next
          ? Math.min(100, Math.max(0, ((exp - currentBase) / (nextBase - currentBase)) * 100))
          : 100;

        return {
          level: current.level,
          title: current.title,
          praise: current.praise,
          reward: current.reward,
          progressPercent,
          nextMinExp: nextBase,
          currentMinExp: currentBase
        };
      }, [totalExp]);

      // 身体・生活配当カルテ（5大カテゴリ別累積集計）
      const personalHealthStats = useMemo(() => {
        const stats = {
          posture: 0,    // 姿勢・筋骨格
          vascular: 0,   // 血管・血液・代謝
          brain: 0,      // 脳・認知・集中
          autonomic: 0,  // 自律神経・睡眠・回復
          environment: 0 // 空間・ストレス防御
        };

        (habits || []).forEach(h => {
          const count = Number(h.totalCount) || 0;
          const k = getHabitDividend(h.name);
          if (k.category.includes('姿勢') || k.category.includes('筋骨格')) stats.posture += count;
          else if (k.category.includes('血管') || k.category.includes('代謝')) stats.vascular += count;
          else if (k.category.includes('脳') || k.category.includes('集中')) stats.brain += count;
          else if (k.category.includes('自律神経') || k.category.includes('睡眠')) stats.autonomic += count;
          else stats.environment += count;
        });

        return stats;
      }, [habits]);

      // EXP加算
      const triggerExpGain = (amount, label = 'EXP') => {
        const val = Number(amount) || 0;
        setTotalExp(prev => (Number(prev) || 0) + val);
        setFloatingExp({ amount: val, label, key: Date.now() });
        setTimeout(() => setFloatingExp(null), 1200);
      };

      // デイリークエスト
      const todayQuests = useMemo(() => {
        const day = new Date().getDate();
        const q1 = DAILY_QUEST_POOL[day % DAILY_QUEST_POOL.length];
        const q2 = DAILY_QUEST_POOL[(day + 3) % DAILY_QUEST_POOL.length];
        return [q1, q2];
      }, []);

      const completeQuest = (quest) => {
        if (completedQuests.includes(quest.id)) return;
        setCompletedQuests(prev => [...prev, quest.id]);
        triggerExpGain(quest.bonusExp, `🎯クエスト達成 +${quest.bonusExp}`);
      };

      // 新ルール提案バナー
      const availableSuggestion = useMemo(() => {
        return RULE_SUGGESTIONS.find(
          s => totalExp >= s.triggerExp && !adoptedSuggestions.includes(s.id)
        );
      }, [totalExp, adoptedSuggestions]);

      const adoptRuleSuggestion = (sug) => {
        const newHabit = {
          id: 'h-' + Date.now(),
          ...sug.habit,
          countToday: 0,
          bonusToday: 0,
          totalCount: 0,
          lastUpdated: ''
        };
        setHabits(prev => [newHabit, ...prev]);
        setAdoptedSuggestions(prev => [...prev, sug.id]);
        triggerExpGain(30, '🎉新ルール採用 +30');
      };

      // 習慣インクリメント
      const handleHabitIncrement = (id, isBonus = false) => {
        setHabits(prev =>
          prev.map(item => {
            if (item.id === id) {
              const expVal = Number(item.exp) || 10;
              const bonusVal = Number(item.bonusExp) || 5;
              const expGain = isBonus ? expVal + bonusVal : expVal;
              triggerExpGain(expGain, isBonus ? `⚡ボーナス +${expGain}` : `+${expGain}`);

              const newTotal = (Number(item.totalCount) || 0) + 1;
              const knowledge = getHabitDividend(item.name);

              // 10, 20, 30, 40, 50, 100回の金字塔マイルストーン
              if ([10, 20, 30, 40, 50, 100].includes(newTotal)) {
                setTimeout(() => {
                  setMilestoneModalData({
                    taskName: item.name,
                    emoji: item.emoji || '✨',
                    totalCount: newTotal,
                    dividendTitle: knowledge.dividendTitle,
                    dividendDesc: knowledge.dividendDesc,
                    trivia: knowledge.trivia
                  });
                }, 350);
              }

              return {
                ...item,
                countToday: (Number(item.countToday) || 0) + 1,
                bonusToday: isBonus ? (Number(item.bonusToday) || 0) + 1 : (Number(item.bonusToday) || 0),
                totalCount: newTotal,
                lastUpdated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              };
            }
            return item;
          })
        );
      };

      // メンテ完了
      const completeMaintenanceTask = (id) => {
        setMaintenance(prev =>
          prev.map(task => {
            if (task.id === id) {
              const gain = Number(task.exp) || 30;
              triggerExpGain(gain, `✨メンテ完了 +${gain}`);
              if (task.type === 'single') {
                return { ...task, completed: true, totalCount: (Number(task.totalCount) || 0) + 1 };
              }
              return {
                ...task,
                lastDoneDate: getTodayString(),
                totalCount: (Number(task.totalCount) || 0) + 1
              };
            }
            return task;
          })
        );
      };

      const handleSaveMaintenance = (taskToSave) => {
        if (!taskToSave || !taskToSave.name || !taskToSave.name.trim()) return;
        setMaintenance(prev => {
          if (!taskToSave.id) {
            const newTask = {
              ...taskToSave,
              id: 'm-' + Date.now(),
              name: taskToSave.name.trim(),
              emoji: taskToSave.emoji || '🧹',
              type: taskToSave.type || 'cycle',
              cycleDays: Number(taskToSave.cycleDays) || 14,
              fixedDay: Math.min(31, Math.max(1, Number(taskToSave.fixedDay) || 1)),
              dueDate: taskToSave.dueDate || getTodayString(),
              lastDoneDate: taskToSave.lastDoneDate || getTodayString(),
              exp: Number(taskToSave.exp) || 30,
              totalCount: Math.max(0, Number(taskToSave.totalCount) || 0),
              completed: taskToSave.type === 'single' ? Boolean(taskToSave.completed) : false
            };
            return [newTask, ...prev];
          } else {
            return prev.map(t => (t.id === taskToSave.id ? {
              ...t,
              ...taskToSave,
              name: taskToSave.name.trim(),
              emoji: taskToSave.emoji || '🧹',
              exp: Number(taskToSave.exp) || 30,
              cycleDays: Number(taskToSave.cycleDays) || 14,
              fixedDay: Math.min(31, Math.max(1, Number(taskToSave.fixedDay) || 1)),
              totalCount: Math.max(0, Number(taskToSave.totalCount) || 0),
              completed: Boolean(taskToSave.completed)
            } : t));
          }
        });
        setEditingMaintenance(null);
      };

      const handleDeleteMaintenance = (id) => {
        setMaintenance(prev => prev.filter(t => t.id !== id));
        setEditingMaintenance(null);
      };

      const addAdhocLog = (name, emoji, exp) => {
        const expVal = Number(exp) || 15;
        const newLog = {
          id: 'adhoc-' + Date.now(),
          name: name || '突発ログ',
          emoji: emoji || '🌟',
          exp: expVal,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setAdhocLogs(prev => [newLog, ...prev]);
        triggerExpGain(expVal, `突発ログ +${expVal}`);
      };

      // ソート
      const sortedHabits = useMemo(() => {
        const safe = Array.isArray(habits) ? habits : [];
        if (!filterUncompleted) return safe;
        return [...safe].sort((a, b) => {
          const aDone = (Number(a.countToday) || 0) > 0 ? 1 : 0;
          const bDone = (Number(b.countToday) || 0) > 0 ? 1 : 0;
          return aDone - bDone;
        });
      }, [habits, filterUncompleted]);

      const sortedMaintenance = useMemo(() => {
        const safe = Array.isArray(maintenance) ? maintenance : [];
        const list = safe.map(task => ({
          ...task,
          _remainingDays: getRemainingDays(task)
        }));
        return list.sort((a, b) => {
          const aComp = a.type === 'single' && a.completed;
          const bComp = b.type === 'single' && b.completed;
          if (aComp && !bComp) return 1;
          if (!aComp && bComp) return -1;
          return a._remainingDays - b._remainingDays;
        });
      }, [maintenance]);

      // 報告文生成（パーソナルテーマ＆科学配当付き）
      const generateReportForDate = (targetDateStr) => {
        const completedList = (habits || []).filter(h => (Number(h.countToday) || 0) > 0);
        const totalTodayCounts = (habits || []).reduce((acc, cur) => acc + (Number(cur.countToday) || 0), 0);

        let report = `🌟 【自己肯定感＆実生活・身体配当 確定報告書】 🌟\n`;
        report += `👤 実践者: ${profile.userName} | テーマ: 「${profile.personalTheme}」\n`;
        report += `📅 日付: ${targetDateStr || getTodayString()}\n`;
        report += `👑 現在の称号: Lv.${currentLevelInfo.level}「${currentLevelInfo.title}」 (累計 ${totalExp} EXP)\n`;
        report += `🌙 24:00自動確定システム記録済\n`;
        report += `────────────────────────────\n\n`;

        report += `🔥 【本日積み上げた偉業（計 ${totalTodayCounts} 回）】\n`;
        if (completedList.length === 0) {
          report += `・まずは息をして今日を生き抜いたこと自体が100点満点の大ファインプレー！\n`;
        } else {
          completedList.forEach(h => {
            report += `・${h.emoji || '✨'} ${h.name} × ${h.countToday}回（通算: ${h.totalCount || 0}回）\n`;
            if ((Number(h.bonusToday) || 0) > 0) {
              report += `  └ ⚡ 条件ボーナス達成: 「${h.bonusText}」 × ${h.bonusToday}回！\n`;
            }
          });
        }

        if (adhocLogs && adhocLogs.length > 0) {
          report += `\n⚡ 【突発的な機転と頑張りのログ】\n`;
          adhocLogs.forEach(l => {
            report += `・${l.emoji || '🌟'} ${l.name} (${l.timestamp}) [+${l.exp} EXP]\n`;
          });
        }

        report += `\n🧬 【本日確定した具体的な実生活・身体配当】\n`;
        if (completedList.length > 0) {
          const uniqueTitled = new Set();
          completedList.forEach(h => {
            const k = getHabitDividend(h.name);
            if (!uniqueTitled.has(k.dividendTitle)) {
              uniqueTitled.add(k.dividendTitle);
              report += `◆ ${h.emoji || '✨'} ${h.name}：${k.dividendTitle}\n`;
              report += `  ${k.dividendDesc}\n`;
              report += `  💡 科学うんちく: ${k.trivia}\n\n`;
            }
          });
        } else {
          report += `・心身の休息配当：無理をせずエネルギーを充填し、自律神経の修復を行いました。\n`;
        }

        report += `────────────────────────────\n`;
        report += `【全肯定メッセージ】\n世界は大きな成果ばかりを求めがちですが、本当に生活を支え、未来の健康と時間を守っているのは、今日あなたがこなした地道な1回1回です。誰が見ていなくても、このアプリとあなたの身体はすべて記憶しています。今夜は胸を張ってゆっくり休んでください✨`;

        return report;
      };

      const copyToClipboard = (text) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        setCopyFeedback(true);
        setTimeout(() => setCopyFeedback(false), 2000);
      };

      return (
        <div className="flex flex-col min-h-[100dvh] bg-slate-900 text-slate-100 font-sans antialiased pb-[calc(env(safe-area-inset-bottom)+88px)]">
          
          {/* Recovery feedback banner */}
          {recoveryToast && (
            <div className="fixed top-3 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md animate-bounce">
              <div className="bg-emerald-500 text-slate-950 px-4 py-2.5 rounded-2xl shadow-xl font-bold text-xs flex items-center justify-between border-2 border-white">
                <span>{recoveryToast}</span>
                <button onClick={() => setRecoveryToast(null)} className="ml-2 font-black text-sm">✕</button>
              </div>
            </div>
          )}

          {/* Floating EXP gain */}
          {floatingExp && (
            <div key={floatingExp.key} className="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none animate-bounce">
              <div className="bg-amber-400 text-slate-950 font-black text-xs px-3.5 py-1.5 rounded-full shadow-lg shadow-amber-400/40 flex items-center gap-1 border-2 border-white">
                <Icon name="zap" className="w-3.5 h-3.5 text-slate-950" fill="currentColor" />
                <span>{floatingExp.label}</span>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 pt-[env(safe-area-inset-top)] px-4 pb-2.5">
            <div className="max-w-xl mx-auto flex items-center justify-between gap-2 pt-2">
              
              {/* Level / Title / User */}
              <div className="flex items-center gap-2 min-w-0">
                <div
                  onClick={() => setShowProfileModal(true)}
                  className="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center font-black text-slate-950 text-sm shadow-md shrink-0 cursor-pointer active:scale-95"
                  title="パーソナルプロフィール・目標を開く"
                >
                  Lv.{currentLevelInfo.level}
                </div>
                <div className="min-w-0 cursor-pointer" onClick={() => setShowProfileModal(true)}>
                  <div className="text-xs font-bold text-amber-300 truncate flex items-center gap-1">
                    <span className="truncate">{profile.userName}</span>
                    <span className="text-[10px] text-slate-400 font-normal">({currentLevelInfo.title})</span>
                  </div>
                  <div className="text-[10px] text-emerald-400 truncate flex items-center gap-1">
                    <span>🎯 {profile.personalTheme}</span>
                  </div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-1 shrink-0">
                <button
                  onClick={() => {
                    const q = MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)];
                    setActiveQuote(q);
                    setShowMotivationModal(true);
                  }}
                  className="px-2 py-1 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 font-bold text-[11px] flex items-center gap-1 active:scale-95 transition-all"
                  title="自己肯定感チャージ！"
                >
                  <Icon name="heart" className="w-3 h-3 text-rose-400" fill="currentColor" />
                  <span>褒めて！</span>
                </button>

                <button
                  onClick={() => setShowDictionaryModal(true)}
                  className="px-2 py-1 rounded-xl bg-sky-950/80 hover:bg-sky-900 border border-sky-400/50 text-sky-300 font-bold text-[11px] flex items-center gap-1 active:scale-95 transition-all"
                  title="医学・科学うんちく＆身体配当 辞書"
                >
                  <span>🧬 科学辞典</span>
                </button>

                <button
                  onClick={() => setShowHistoryModal(true)}
                  className="px-2 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-bold text-[11px] flex items-center gap-1 transition-all active:scale-95"
                  title="過去のTOP3＆直近1週間の報告文アーカイブ"
                >
                  <Icon name="book-open" className="w-3 h-3 text-amber-400" />
                  <span>実績</span>
                </button>

                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300"
                  title="設定・バックアップ"
                >
                  <Icon name="settings" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>

            {/* EXP Gauge */}
            <div className="max-w-xl mx-auto mt-2">
              <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden border border-slate-700/50">
                <div
                  className="bg-gradient-to-r from-amber-400 to-orange-500 h-full rounded-full transition-all duration-300"
                  style={{ width: `${currentLevelInfo.progressPercent}%` }}
                />
              </div>
            </div>

            {/* Real-time TOP 3 Ranking Bar */}
            <div
              onClick={() => setShowHistoryModal(true)}
              className="max-w-xl mx-auto mt-2 bg-gradient-to-r from-amber-500/15 via-orange-500/15 to-amber-500/10 hover:from-amber-500/25 hover:to-orange-500/20 border border-amber-500/40 rounded-xl px-3 py-1.5 flex items-center justify-between cursor-pointer transition-all active:scale-[0.99] shadow-sm"
              title="タップで歴代TOP3と過去1週間の報告文を開く"
            >
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-sm shrink-0">
                  {rankingTargetInfo.targetRank === 1 ? '👑' : rankingTargetInfo.targetRank === 2 ? '🥈' : '🥉'}
                </span>
                <div className="flex items-center gap-1.5 flex-wrap min-w-0">
                  <span className="text-[11px] text-slate-300 font-medium">
                    本日: <strong className="text-amber-300 font-mono font-bold">+{todayEarnedExp}</strong> EXP
                  </span>
                  <span className="text-slate-600 text-[10px]">|</span>
                  <span className="text-xs font-black text-amber-200 tracking-tight whitespace-normal break-words">
                    {rankingTargetInfo.text}
                  </span>
                </div>
              </div>
              <div className="flex items-center gap-1 text-[10px] text-amber-400 font-bold shrink-0 pl-1">
                <span>歴代TOP3</span>
                <Icon name="book-open" className="w-3 h-3 text-amber-400" />
              </div>
            </div>
          </header>

          {/* デイリー特別クエスト (日替わりミッション) */}
          <div className="max-w-xl mx-auto w-full px-4 pt-2">
            <div className="bg-gradient-to-r from-indigo-950/60 to-purple-950/60 border border-indigo-500/30 rounded-2xl p-2.5">
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-1 text-xs font-bold text-indigo-300">
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-400" fill="currentColor" />
                  <span>本日のデイリー特別クエスト</span>
                </div>
                <span className="text-[10px] text-indigo-300/80">達成で即ボーナス</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                {todayQuests.map((quest) => {
                  const isDone = completedQuests.includes(quest.id);
                  return (
                    <div
                      key={quest.id}
                      onClick={() => !isDone && completeQuest(quest)}
                      className={`flex items-center justify-between p-2 rounded-xl border transition-all ${
                        isDone
                          ? 'bg-indigo-950/40 border-indigo-500/20 opacity-70'
                          : 'bg-slate-900/80 hover:bg-slate-800 border-indigo-400/30 cursor-pointer active:scale-95'
                      }`}
                    >
                      <div className="flex items-center gap-1.5 min-w-0 pr-1">
                        <span className="text-sm shrink-0">{quest.emoji}</span>
                        <span className={`text-[11px] leading-snug truncate ${isDone ? 'line-through text-slate-400' : 'text-slate-200'}`}>
                          {quest.text}
                        </span>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <span className="text-[10px] font-bold text-amber-300 font-mono">+{quest.bonusExp}</span>
                        {isDone ? (
                          <Icon name="check-circle" className="w-4 h-4 text-emerald-400" />
                        ) : (
                          <Icon name="circle" className="w-4 h-4 text-slate-500" />
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* 新ルール自動提案バナー */}
          {availableSuggestion && (
            <div className="max-w-xl mx-auto w-full px-4 pt-2">
              <div className="bg-amber-950/40 border border-amber-500/40 rounded-2xl p-2.5 flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <div className="flex items-center gap-1 text-xs font-bold text-amber-300">
                    <Icon name="flame" className="w-3.5 h-3.5 text-orange-400" />
                    <span>{availableSuggestion.title}</span>
                  </div>
                  <p className="text-[11px] text-slate-300 mt-0.5 leading-snug">
                    {availableSuggestion.description}
                  </p>
                </div>
                <button
                  onClick={() => adoptRuleSuggestion(availableSuggestion)}
                  className="shrink-0 px-3 py-1.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-xs rounded-xl shadow active:scale-95"
                >
                  採用する
                </button>
              </div>
            </div>
          )}

          {/* Tabs and Filter */}
          <div className="max-w-xl mx-auto w-full px-4 pt-2">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5 bg-slate-800/80 px-2.5 py-1 rounded-xl border border-slate-700/60 text-xs">
                <Icon name="filter" className="w-3 h-3 text-slate-400" />
                <span className="text-slate-300 text-[11px] font-medium">未完了を優先</span>
                <button
                  type="button"
                  onClick={() => setFilterUncompleted(!filterUncompleted)}
                  className={`w-7 h-4 flex items-center rounded-full p-0.5 transition-colors ${
                    filterUncompleted ? 'bg-amber-500 justify-end' : 'bg-slate-700 justify-start'
                  }`}
                >
                  <div className="bg-white w-3 h-3 rounded-full shadow-sm" />
                </button>
              </div>

              <button
                onClick={() => setShowProfileModal(true)}

                      <input
                        type="text"
                        value={editingMaintenance.emoji || '🧹'}
                        onChange={(e) => setEditingMaintenance({ ...editingMaintenance, emoji: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100 text-center text-lg"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">獲得EXP</label>
                      <input
                        type="number"
                        value={editingMaintenance.exp ?? 30}
                        onChange={(e) => setEditingMaintenance({ ...editingMaintenance, exp: Number(e.target.value) })}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                  </div>

                  {editingMaintenance.type === 'cycle' && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1">サイクル目安 (日)</label>
                        <input
                          type="number"
                          min={1}
                          value={editingMaintenance.cycleDays ?? 14}
                          onChange={(e) => setEditingMaintenance({ ...editingMaintenance, cycleDays: Number(e.target.value) })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">前回実施日</label>
                        <input
                          type="date"
                          value={editingMaintenance.lastDoneDate || getTodayString()}
                          onChange={(e) => setEditingMaintenance({ ...editingMaintenance, lastDoneDate: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                        />
                      </div>
                    </div>
                  )}

                  {editingMaintenance.type === 'monthly' && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1">毎月指定日 (1〜31日)</label>
                        <input
                          type="number"
                          min={1}
                          max={31}
                          value={editingMaintenance.fixedDay ?? 1}
                          onChange={(e) => setEditingMaintenance({ ...editingMaintenance, fixedDay: Number(e.target.value) })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">前回実施日</label>
                        <input
                          type="date"
                          value={editingMaintenance.lastDoneDate || getTodayString()}
                          onChange={(e) => setEditingMaintenance({ ...editingMaintenance, lastDoneDate: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                        />
                      </div>
                    </div>
                  )}

                  {editingMaintenance.type === 'single' && (
                    <div className="space-y-2">
                      <div>
                        <label className="block text-slate-400 mb-1">締切期日</label>
                        <input
                          type="date"
                          value={editingMaintenance.dueDate || ''}
                          onChange={(e) => setEditingMaintenance({ ...editingMaintenance, dueDate: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                        />
                      </div>
                      <div className="flex items-center gap-2 pt-1">
                        <input
                          type="checkbox"
                          id="edit-maint-completed"
                          checked={Boolean(editingMaintenance.completed)}
                          onChange={(e) => setEditingMaintenance({ ...editingMaintenance, completed: e.target.checked })}
                          className="w-4 h-4 rounded bg-slate-800 border-slate-700 text-amber-500 focus:ring-0"
                        />
                        <label htmlFor="edit-maint-completed" className="text-slate-300">
                          完了状態にする
                        </label>
                      </div>
                    </div>
                  )}

                  {editingMaintenance.id && (
                    <div>
                      <label className="block text-slate-400 mb-1">通算実施回数</label>
                      <input
                        type="number"
                        min={0}
                        value={editingMaintenance.totalCount ?? 0}
                        onChange={(e) => setEditingMaintenance({ ...editingMaintenance, totalCount: Number(e.target.value) })}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                      />
                    </div>
                  )}

                  <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                    {editingMaintenance.id ? (
                      <button
                        type="button"
                        onClick={() => handleDeleteMaintenance(editingMaintenance.id)}
                        className="px-3 py-2 bg-rose-500/20 text-rose-300 rounded-xl text-xs font-bold"
                      >
                        削除
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={() => setEditingMaintenance(null)}
                        className="px-4 py-2 bg-slate-800 text-slate-400 rounded-xl"
                      >
                        キャンセル
                      </button>
                    )}
                    <button
                      type="submit"
                      className="px-5 py-2.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold rounded-xl text-xs active:scale-95"
                    >
                      {editingMaintenance.id ? '変更を保存する' : '登録する'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 金字塔モーダル */}
          {milestoneModalData && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border-2 border-amber-400/80 w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
                <div className="text-center pt-2">
                  <div className="text-3xl mb-1">{milestoneModalData.emoji}</div>
                  <div className="text-xs font-black text-amber-400 uppercase tracking-widest">
                    🎉 金字塔達成！通算 {milestoneModalData.totalCount} 回突破 🎉
                  </div>
                  <h3 className="text-lg font-black text-white mt-1">
                    「{milestoneModalData.taskName}」の達人
                  </h3>
                </div>

                <div className="mt-3 bg-slate-800/80 border border-slate-700 rounded-2xl p-3.5">
                  <div className="text-xs font-bold text-amber-300 mb-1">
                    {milestoneModalData.dividendTitle}
                  </div>
                  <p className="text-xs text-slate-200 leading-relaxed font-medium">
                    {milestoneModalData.dividendDesc}
                  </p>
                </div>

                <div className="mt-3 bg-sky-950/40 border border-sky-500/30 rounded-2xl p-3.5">
                  <div className="text-xs font-bold text-sky-300 mb-1 flex items-center gap-1.5">
                    <span>💡 タスク特化・科学うんちく</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    {milestoneModalData.trivia}
                  </p>
                </div>

                <button
                  onClick={() => setMilestoneModalData(null)}
                  className="mt-4 w-full py-2.5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-xs rounded-xl"
                >
                  誇らしく受け取る！
                </button>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-slate-100 flex items-center gap-1.5">
                    <Icon name="settings" className="w-4 h-4 text-amber-400" />
                    <span>データ保護・アプリ設定</span>
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="p-1 rounded-xl bg-slate-800 text-slate-400">
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 mt-4 text-xs">
                  <button
                    onClick={() => setShowInstallGuideModal(true)}
                    className="w-full py-2.5 px-3 bg-gradient-to-r from-amber-500/20 to-indigo-600/30 border border-amber-400/40 rounded-xl text-amber-200 font-bold text-xs"
                  >
                    📱 iPhoneで完全専用アプリ化する手順（1分）
                  </button>

                  <button
                    onClick={() => {
                      const data = {
                        schemaVersion: CURRENT_SCHEMA_VERSION,
                        totalExp,
                        habits,
                        maintenance,
                        adhocLogs,
                        completedQuests,
                        adoptedSuggestions,
                        savedReports,
                        profile,
                        lastActiveDate
                      };
                      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `habit-backup-${getTodayString()}.json`;
                      a.click();
                      URL.revokeObjectURL(url);
                    }}
                    className="w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold flex items-center justify-center gap-2 text-slate-100"
                  >
                    <Icon name="download" className="w-4 h-4 text-amber-400" />
                    <span>JSONバックアップをダウンロード</span>
                  </button>

                  <label className="w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold flex items-center justify-center gap-2 cursor-pointer text-slate-100">
                    <Icon name="upload" className="w-4 h-4 text-sky-400" />
                    <span>JSONバックアップから安全復元</span>
                    <input
                      type="file"
                      accept=".json"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const r = new FileReader();
                        r.onload = (evt) => {
                          try {
                            const rawParsed = JSON.parse(evt.target.result);
                            const safe = sanitizeAppState(rawParsed);

                            setHabits(safe.habits);
                            setTotalExp(safe.totalExp);
                            setMaintenance(safe.maintenance);
                            setSavedReports(safe.savedReports);
                            setAdhocLogs(safe.adhocLogs);
                            setCompletedQuests(safe.completedQuests);
                            setAdoptedSuggestions(safe.adoptedSuggestions);
                            setProfile(safe.profile);
                            setLastActiveDate(safe.lastActiveDate);

                            setShowSettingsModal(false);
                            setRecoveryToast('🎉 データを正常に引き継ぎ、安全に復元しました！');
                            setTimeout(() => setRecoveryToast(null), 3500);
                          } catch (err) {
                            setRecoveryToast('⚠️ ファイルの形式が不正です。正しいJSONファイルを選択してください。');
                          }
                        };
                        r.readAsText(file);
                      }}
                      className="hidden"
                    />
                  </label>

                  <div className="pt-2 border-t border-slate-800">
                    <button
                      onClick={() => {
                        try {
                          localStorage.removeItem(STORAGE_KEY);
                          setHabits(INITIAL_HABITS);
                          setMaintenance(INITIAL_MAINTENANCE);
                          setSavedReports(INITIAL_SAVED_REPORTS);
                          setTotalExp(140);
                          setAdhocLogs([]);
                          setProfile(sanitizeProfile(null));
                          setShowSettingsModal(false);
                          setRecoveryToast('初期プリセットに安全リセットしました。');
                          setTimeout(() => setRecoveryToast(null), 3000);
                        } catch (err) {}
                      }}
                      className="w-full py-2 text-rose-400 hover:text-rose-300 text-[11px] text-center"
                    >
                      初期状態にクリーンリセット
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* iPhone App Guide Modal */}
          {showInstallGuideModal && (
            <div className="fixed inset-0 z-[60] bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="text-sm font-bold text-amber-300">iPhone専用アプリ化（約1分）</div>
                  <button onClick={() => setShowInstallGuideModal(false)} className="p-1 rounded-xl bg-slate-800 text-slate-400">
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>
                <div className="mt-3 space-y-2.5 text-xs text-slate-300 leading-relaxed">
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">1. ファイルを保存:</strong><br />
                    画面のコード枠またはダウンロードボタンからこの `index.html` を保存します。
                  </div>
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">2. tiiny.host を開く:</strong><br />
                    Safariで無料ホスティング <a href="https://tiiny.host" target="_blank" className="text-amber-400 underline">tiiny.host</a> を開きます。
                  </div>
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">3. アップロード:</strong><br />
                    index.html を選択して Publish を押すと数秒で専用URLが発行されます。
                  </div>
                  <div className="p-2.5 bg-slate-800/80 rounded-xl border border-slate-700">
                    <strong className="text-amber-300">4. ホーム画面に追加:</strong><br />
                    Safariの共有ボタン（⎋）から「ホーム画面に追加」を押せば、全画面の専用アプリが完成します。
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
